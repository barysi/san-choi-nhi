<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Năm trò chơi nhỏ cho trẻ 7–11 tuổi: lật thẻ tìm cặp, tính nhẩm, bắt ếch, xếp chữ và hứng quả.">
<title>Sân Chơi Nhí</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Grandstander:wght@700;800&family=Patrick+Hand&display=swap">
<style>
html{padding:env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px)}
/* Layout: one page of a "vở ô li" school notebook. A single column hangs on the red
   margin line; the menu is five ruled rows, and each game opens as a sheet pasted onto
   the same page. The dark theme is the classroom chalkboard. */
:root{
  --paper:#FAFBFF; --surface:#FFFFFF;
  --grid:rgba(88,76,196,.09); --grid-strong:rgba(88,76,196,.19);
  --margin:#E4566E;
  --ink:#2B2170; --ink-soft:#5D569A; --rule:rgba(43,33,112,.22); --on-ink:#FFFFFF;
  --red:#CF1F38;
  --hl:#FFE566; --sun:#FFC933; --on-sun:#3A2C00; --focus:#D97706;
  --good:#14804A; --good-bg:#DDF5E7; --bad:#C4283C; --bad-bg:#FDE3E6;
  --pond:#CDE9F4; --leaf:#43A862; --sky-top:#DDF0FA; --sky-bot:#F7FBEA;
  --font-display:"Grandstander","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-hand:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1D3A31; --surface:#264639;
    --grid:rgba(255,255,255,.04); --grid-strong:rgba(255,255,255,.085);
    --margin:#F29AA8;
    --ink:#F4F1E2; --ink-soft:#B8CABF; --rule:rgba(244,241,226,.24); --on-ink:#1D3A31;
    --red:#FF9AA8;
    --hl:rgba(255,221,87,.3); --sun:#FFD95C; --on-sun:#3A2C00; --focus:#FFE27A;
    --good:#8FE3B0; --good-bg:rgba(143,227,176,.16); --bad:#FFA0AC; --bad-bg:rgba(255,160,172,.16);
    --pond:#16485A; --leaf:#3C9257; --sky-top:#17342D; --sky-bot:#234A3C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1D3A31; --surface:#264639;
  --grid:rgba(255,255,255,.04); --grid-strong:rgba(255,255,255,.085);
  --margin:#F29AA8;
  --ink:#F4F1E2; --ink-soft:#B8CABF; --rule:rgba(244,241,226,.24); --on-ink:#1D3A31;
  --red:#FF9AA8;
  --hl:rgba(255,221,87,.3); --sun:#FFD95C; --on-sun:#3A2C00; --focus:#FFE27A;
  --good:#8FE3B0; --good-bg:rgba(143,227,176,.16); --bad:#FFA0AC; --bad-bg:rgba(255,160,172,.16);
  --pond:#16485A; --leaf:#3C9257; --sky-top:#17342D; --sky-bot:#234A3C;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}

body{
  margin:0;
  font:17px/1.55 var(--font-body);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:32px 32px, 32px 32px, 8px 8px, 8px 8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 56px;
}
.page{
  max-width:720px; margin-inline:auto;
  border-left:2px solid var(--margin);
  padding-left:clamp(14px, 4vw, 28px);
  display:flex; flex-direction:column; gap:22px;
}

/* ---------- header ---------- */
.top{display:flex; flex-direction:column; gap:6px}
.dateline{margin:0; font:1.2rem/1.3 var(--font-hand); color:var(--ink-soft)}
.top-row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px 16px; flex-wrap:wrap}
h1{
  margin:0; font:800 clamp(2.1rem, 8vw, 3.3rem)/1.2 var(--font-display);
  letter-spacing:-.01em; text-wrap:balance;
}
.title-ul{border-bottom:5px double var(--red); padding-bottom:1px}

/* ---------- buttons ---------- */
.btn{
  font:700 1rem/1.2 var(--font-body);
  min-height:48px; padding:10px 18px;
  border:2px solid var(--ink); border-radius:8px;
  background:var(--surface); color:var(--ink);
  cursor:pointer; touch-action:manipulation;
}
.btn-primary{background:var(--ink); color:var(--on-ink)}
.btn-small{min-height:42px; padding:8px 14px; font-size:.92rem}
.btn:disabled{opacity:.45; cursor:default}
button:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

/* ---------- home ---------- */
#home{display:flex; flex-direction:column; gap:16px}
.lede{margin:0; font-size:1.08rem; max-width:52ch}
.games{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.games li{border-bottom:1.5px solid var(--rule)}
.games li:first-child{border-top:1.5px solid var(--rule)}
.game-row{
  display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:14px; align-items:center;
  width:100%; padding:14px 4px; text-align:left;
  background:none; border:0; border-radius:4px; color:inherit; font:inherit;
  cursor:pointer; touch-action:manipulation;
}
.g-icon{
  width:52px; height:52px; display:grid; place-items:center;
  border:2px solid var(--ink); border-radius:10px;
  background:var(--surface); color:var(--ink);
  box-shadow:0 3px 0 var(--ink); transition:transform .08s, box-shadow .08s;
}
.game-row:active .g-icon{transform:translateY(3px); box-shadow:0 0 0 var(--ink)}
.g-icon svg{width:40px; height:40px; display:block}
.i-st{fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round}
.i-hl{fill:var(--hl)}
.i-pa{fill:var(--surface)}
.i-ink{fill:currentColor}
.i-tx{fill:currentColor; font:800 15px var(--font-display)}
.g-text{display:flex; flex-direction:column; gap:2px; min-width:0}
.g-no{font-size:.76rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
.g-name{font:800 1.32rem/1.25 var(--font-display)}
.g-name span{
  background:linear-gradient(var(--hl), var(--hl)) no-repeat 0 88% / 0% 44%;
  transition:background-size .25s ease-out;
}
.game-row:hover .g-name span,
.game-row:focus-visible .g-name span{background-size:100% 44%}
.g-desc{font-size:.94rem; line-height:1.4; color:var(--ink-soft)}
.g-best{display:flex; flex-direction:column; align-items:center; gap:4px; width:68px}
.g-cap{font-size:.68rem; line-height:1.2; text-align:center; color:var(--ink-soft)}
.mark{
  width:50px; height:50px; display:grid; place-items:center;
  border:2.5px solid var(--red); color:var(--red);
  border-radius:47% 53% 50% 50% / 53% 46% 54% 47%;
  font:1.7rem/1 var(--font-hand); transform:rotate(-7deg);
  font-variant-numeric:tabular-nums;
}
.mark.is-empty{border:2px dashed var(--rule); color:var(--ink-soft); font-size:1.2rem; transform:none}
.footnote{margin:0; font-size:.88rem; color:var(--ink-soft); max-width:60ch}

/* ---------- game frame ---------- */
#play{display:flex; flex-direction:column; gap:14px}
.game-head{display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap}
.game-head > div{min-width:0}
.eyebrow{margin:0; font-size:.76rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
h2{margin:0; font:800 clamp(1.5rem, 5.5vw, 2rem)/1.2 var(--font-display); text-wrap:balance}
.hud{display:flex; flex-wrap:wrap; gap:4px 20px; min-height:32px; align-items:baseline; font-weight:600; font-variant-numeric:tabular-nums}
.hud b{font:400 1.4rem/1 var(--font-hand); color:var(--red); margin-left:2px}
.stage{
  background:var(--surface);
  border:2px solid var(--ink); border-radius:6px;
  box-shadow:5px 5px 0 var(--rule);
  padding:clamp(14px, 4vw, 24px);
  -webkit-user-select:none; user-select:none;
}

/* ---------- intro + result ---------- */
.intro h3{margin:0 0 6px; font:800 1.15rem/1.3 var(--font-display)}
.howto{margin:0 0 20px; padding-left:1.2em; display:flex; flex-direction:column; gap:4px; max-width:60ch}
.levels{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:14px}
.level{
  display:flex; flex-direction:column; gap:2px; text-align:left;
  padding:12px 14px 10px; font:inherit; color:var(--ink);
  background:var(--surface); border:2px solid var(--ink); border-radius:8px;
  box-shadow:0 4px 0 var(--ink); cursor:pointer; touch-action:manipulation;
  transition:transform .08s, box-shadow .08s;
}
.level:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.lv-age{font-size:.74rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft)}
.lv-name{font:800 1.4rem/1.2 var(--font-display)}
.lv-what{font-size:.92rem; line-height:1.4}
.lv-rec{font:1.1rem/1.3 var(--font-hand); color:var(--red); margin-top:4px}

.result{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px 22px; align-items:center}
.mark-big{width:112px; height:112px; font-size:4.2rem; border-width:3.5px}
.result-text{display:flex; flex-direction:column; gap:6px}
.phe{margin:0; font:1.7rem/1.2 var(--font-hand); color:var(--red); text-wrap:balance}
.result-line{margin:0}
.result-rec{margin:0; font-size:.94rem; color:var(--ink-soft)}
.new-rec{background:var(--hl); color:var(--ink); padding:1px 6px; font-weight:700}
.result-actions{grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:10px; margin-top:8px}
@media (max-width:430px){ .result{grid-template-columns:minmax(0,1fr)} }

/* ---------- 1. lật thẻ ---------- */
.mem-grid{
  display:grid; grid-template-columns:repeat(var(--cols), minmax(0,1fr));
  gap:clamp(6px, 2vw, 12px); max-width:calc(var(--cols) * 104px); margin-inline:auto;
}
.mem-card{aspect-ratio:3 / 4; padding:0; border:0; background:none; border-radius:8px; cursor:pointer; perspective:600px; touch-action:manipulation}
.mem-inner{position:relative; display:block; width:100%; height:100%; transform-style:preserve-3d; transition:transform .32s}
.mem-card.is-open .mem-inner{transform:rotateY(180deg)}
.mem-back,.mem-face{
  position:absolute; inset:0; display:grid; place-items:center;
  border:2px solid var(--ink); border-radius:8px;
  -webkit-backface-visibility:hidden; backface-visibility:hidden;
}
.mem-back{background:var(--ink); color:var(--on-ink); font:800 clamp(1.3rem, 6vw, 2rem)/1 var(--font-display)}
.mem-face{background:var(--surface); transform:rotateY(180deg); font:clamp(1.7rem, 8.5vw, 2.9rem)/1 var(--emoji)}
.mem-card.is-done .mem-face{background:var(--good-bg); border-color:var(--good)}

/* ---------- 2. tính nhẩm ---------- */
.q-timer{height:14px; border:2px solid var(--ink); border-radius:99px; overflow:hidden; max-width:460px; margin-inline:auto}
.q-timer i{display:block; height:100%; width:100%; background:var(--sun)}
.q-text{margin:18px 0; text-align:center; font:800 clamp(2.3rem, 12vw, 3.8rem)/1.15 var(--font-display); font-variant-numeric:tabular-nums}
.q-choices{display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:460px; margin-inline:auto}
.q-choice{
  position:relative; min-height:72px; padding:8px;
  font:800 1.7rem/1 var(--font-display); font-variant-numeric:tabular-nums; color:var(--ink);
  background:var(--surface); border:2px solid var(--ink); border-radius:10px;
  box-shadow:0 4px 0 var(--ink); cursor:pointer; touch-action:manipulation;
}
.q-choice kbd{position:absolute; top:5px; left:8px; font:600 .68rem/1 var(--font-body); color:var(--ink-soft)}
.q-choice.is-right{background:var(--good-bg); border-color:var(--good); color:var(--good); box-shadow:0 4px 0 var(--good)}
.q-choice.is-wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad); box-shadow:0 4px 0 var(--bad)}

/* ---------- 3. bắt ếch ---------- */
.pond{
  display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:clamp(8px, 3vw, 16px);
  max-width:420px; margin-inline:auto; padding:clamp(10px, 3vw, 18px);
  background:var(--pond); border:2px solid var(--ink); border-radius:14px;
}
.pad{position:relative; aspect-ratio:1; padding:0; border:0; background:none; border-radius:50%; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.pad::before{
  content:""; position:absolute; inset:12% 3% 2%; border-radius:50%;
  background:conic-gradient(from 35deg, transparent 0 30deg, var(--leaf) 30deg 360deg);
}
.critter{
  position:absolute; inset:0; display:grid; place-items:center;
  font:clamp(2rem, 11vw, 3.2rem)/1 var(--emoji);
  transform:translateY(28%) scale(0); opacity:0; pointer-events:none;
  transition:transform .14s ease-out, opacity .1s;
}
.pad.is-up .critter{transform:translateY(-4%) scale(1); opacity:1}
.pad[data-kind="gold"]::after{
  content:"×3"; position:absolute; top:0; right:0;
  padding:2px 7px; border:2px solid var(--ink); border-radius:99px;
  background:var(--sun); color:var(--on-sun); font:800 .8rem/1.2 var(--font-display);
}
.pop{
  position:absolute; left:50%; top:2%; transform:translateX(-50%);
  font:800 1.15rem/1 var(--font-display); color:var(--ink); white-space:nowrap;
  pointer-events:none; animation:rise .65s ease-out forwards;
}
.pop.is-bad{color:var(--bad)}
@keyframes rise{ to{ transform:translate(-50%, -24px); opacity:0 } }

/* ---------- 4. xếp chữ ---------- */
.w-emoji{text-align:center; font:clamp(3rem, 16vw, 4.4rem)/1.1 var(--emoji)}
.w-clue{margin:8px auto 18px; max-width:34ch; text-align:center; font-size:1.1rem; text-wrap:balance}
.w-slots{display:flex; flex-wrap:wrap; justify-content:center; gap:12px 24px}
.w-slots.is-shake{animation:shake .4s}
.w-syll{display:flex; gap:6px}
.w-slot{
  width:clamp(32px, 9.5vw, 48px); aspect-ratio:1 / 1.15; padding:0;
  border:0; border-bottom:3px solid var(--ink); border-radius:4px 4px 0 0;
  background:transparent; color:var(--ink); opacity:1;
  font:800 clamp(1.25rem, 6vw, 1.8rem)/1 var(--font-display);
}
.w-slot.is-filled{background:var(--hl)}
.w-slot.is-filled:not(:disabled){cursor:pointer}
.w-slot.is-locked{background:var(--good-bg); color:var(--good); border-bottom-color:var(--good)}
.w-msg{margin:10px 0; min-height:1.5em; text-align:center; font:1.3rem/1.3 var(--font-hand); color:var(--red)}
.w-pool{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; min-height:56px}
.w-tile{
  width:clamp(40px, 11vw, 52px); aspect-ratio:1; padding:0;
  font:800 clamp(1.25rem, 6vw, 1.7rem)/1 var(--font-display); color:var(--ink);
  background:var(--surface); border:2px solid var(--ink); border-radius:8px;
  box-shadow:0 3px 0 var(--ink); cursor:pointer; touch-action:manipulation;
}
.w-tile.is-used{visibility:hidden}
.w-actions{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:18px}
@keyframes shake{ 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

/* ---------- 5. hứng quả ---------- */
.catch-wrap{
  width:100%; max-width:520px; height:clamp(340px, 60vh, 600px); margin-inline:auto;
  border:2px solid var(--ink); border-radius:10px; overflow:hidden;
  background:linear-gradient(var(--sky-top), var(--sky-bot));
}
.catch-cv{display:block; width:100%; height:100%; touch-action:none; cursor:ew-resize; color:var(--ink)}
.catch-cv:focus-visible{outline:3px solid var(--focus); outline-offset:-3px}

@media (prefers-reduced-motion: reduce){
  .mem-inner,.critter,.g-icon,.level,.g-name span{transition:none}
  .pop,.w-slots.is-shake{animation:none}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <p class="dateline" id="dateline">Giờ ra chơi</p>
    <div class="top-row">
      <h1><span class="title-ul">Sân Chơi Nhí</span></h1>
      <button class="btn btn-small" id="soundBtn" type="button" aria-pressed="true">Âm thanh: bật</button>
    </div>
  </header>

  <main>
    <section id="home">
      <p class="lede">Tùng, tùng, tùng! Trống báo giờ ra chơi rồi. Em chọn một trong năm trò dưới đây nhé.</p>
      <ol class="games" id="menu"></ol>
      <p class="footnote">Dành cho các bạn từ 7 đến 11 tuổi. Chơi được bằng chuột, bàn phím hoặc chạm màn hình. Điểm cao nhất được lưu ngay trên máy này.</p>
    </section>

    <section id="play" hidden>
      <div class="game-head">
        <button class="btn btn-small" id="backBtn" type="button">← Về sân chơi</button>
        <div>
          <p class="eyebrow" id="gameSkill"></p>
          <h2 id="gameTitle"></h2>
        </div>
      </div>
      <div class="hud" id="hud"></div>
      <div class="stage" id="stage"></div>
    </section>
  </main>
</div>

<script>
(() => {
'use strict';
document.documentElement.lang = 'vi';

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(2)){
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const rand = (n) => Math.floor(Math.random() * n);
const rint = (a, b) => a + rand(b - a + 1);
const lerp = (a, b, p) => a + (b - a) * p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* Scores live in this browser only; the page works the same without storage. */
const mem = {};
const store = {
  get(k, d){
    if (k in mem) return mem[k];
    try { const v = localStorage.getItem('scn:' + k); if (v != null) return (mem[k] = JSON.parse(v)); } catch (e) {}
    return d;
  },
  set(k, v){ mem[k] = v; try { localStorage.setItem('scn:' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- sound ---------- */
let soundOn = store.get('sound', true) !== false;
let actx = null;
function tone(freq, dur, type, delay, vol){
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
const sfx = {
  tap(){ tone(440, 0.06, 'sine', 0, 0.08); },
  ok(){ tone(660, 0.09); tone(990, 0.14, 'triangle', 0.08); },
  bad(){ tone(180, 0.22, 'sawtooth', 0, 0.07); },
  star(){ tone(880, 0.08); tone(1175, 0.08, 'triangle', 0.07); tone(1568, 0.16, 'triangle', 0.14); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', i * 0.13, 0.13)); }
};

/* ---------- one "run" owns every timer and listener of a game in progress ---------- */
function makeRun(){
  const timeouts = new Set(), intervals = new Set(), offs = [];
  let raf = 0, alive = true;
  return {
    get alive(){ return alive; },
    timeout(fn, ms){ const id = setTimeout(() => { timeouts.delete(id); if (alive) fn(); }, ms); timeouts.add(id); return id; },
    interval(fn, ms){ const id = setInterval(() => { if (alive) fn(); }, ms); intervals.add(id); return id; },
    frame(fn){
      let last = performance.now();
      const loop = (now) => {
        if (!alive) return;
        const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
        fn(dt);
        if (alive) raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    },
    on(target, ev, fn, opt){ target.addEventListener(ev, fn, opt); offs.push(() => target.removeEventListener(ev, fn, opt)); },
    stop(){ alive = false; timeouts.forEach(clearTimeout); intervals.forEach(clearInterval); cancelAnimationFrame(raf); offs.forEach((f) => f()); }
  };
}

/* ================= 1. Lật thẻ tìm cặp ================= */
const ANIMALS = ['🐶','🐱','🐰','🐼','🦊','🐸','🐵','🐯','🐮','🐷','🐔','🐧','🦁','🐨','🐙','🦋','🐢','🐬'];
function startMemory({ stage, run, level, hud, finish }){
  const cfg = [{ cols: 4, pairs: 6 }, { cols: 4, pairs: 8 }, { cols: 5, pairs: 10 }][level];
  const faces = shuffle(ANIMALS).slice(0, cfg.pairs);
  const deck = shuffle(faces.concat(faces));
  let open = [], found = 0, moves = 0, lock = false, t0 = 0;
  const secs = () => (t0 ? Math.floor((performance.now() - t0) / 1000) : 0);
  const paint = () => hud([['Lượt lật', moves], ['Đã tìm', found + '/' + cfg.pairs + ' cặp'], ['Thời gian', secs() + ' giây']]);
  const grid = h('div', { class: 'mem-grid', style: '--cols:' + cfg.cols });
  deck.forEach((face) => {
    const card = h('button', { class: 'mem-card', type: 'button', 'aria-label': 'Thẻ đang úp' },
      h('span', { class: 'mem-inner' }, h('span', { class: 'mem-back' }, '?'), h('span', { class: 'mem-face' }, face)));
    card.addEventListener('click', () => flip(card, face));
    grid.append(card);
  });
  function flip(card, face){
    if (lock || card.classList.contains('is-open')) return;
    if (!t0){ t0 = performance.now(); run.interval(paint, 1000); }
    card.classList.add('is-open'); card.setAttribute('aria-label', 'Thẻ ' + face); sfx.tap();
    open.push({ card, face });
    if (open.length < 2) return;
    moves++;
    const [a, b] = open; open = [];
    if (a.face === b.face){
      found++; a.card.classList.add('is-done'); b.card.classList.add('is-done'); sfx.ok();
      if (found === cfg.pairs){ lock = true; const time = secs(); run.timeout(() => done(time), 700); }
    } else {
      lock = true;
      run.timeout(() => {
        for (const o of [a, b]){ o.card.classList.remove('is-open'); o.card.setAttribute('aria-label', 'Thẻ đang úp'); }
        lock = false;
      }, 900);
    }
    paint();
  }
  function done(time){
    const r = moves / cfg.pairs;
    const mark = r <= 1.7 ? 10 : r <= 2 ? 9 : r <= 2.4 ? 8 : r <= 2.8 ? 7 : r <= 3.3 ? 6 : 5;
    finish({ mark, record: moves, lines: ['Em tìm đủ ' + cfg.pairs + ' cặp sau ' + moves + ' lượt lật, hết ' + time + ' giây.'] });
  }
  stage.append(grid); paint();
}

/* ================= 2. Tính nhẩm 60 giây ================= */
function makeQuestion(level){
  let a, b, op, ans;
  const k = Math.random();
  if (level === 0){
    if (k < 0.5){ a = rint(1, 10); b = rint(1, 10); op = '+'; ans = a + b; }
    else { a = rint(4, 20); b = rint(1, Math.min(10, a - 1)); op = '−'; ans = a - b; }
  } else if (level === 1){
    if (k < 0.35){ a = rint(12, 60); b = rint(6, 39); op = '+'; ans = a + b; }
    else if (k < 0.7){ a = rint(25, 99); b = rint(6, Math.min(45, a - 6)); op = '−'; ans = a - b; }
    else { a = rint(2, 5); b = rint(2, 10); op = '×'; ans = a * b; }
  } else {
    if (k < 0.4){ a = rint(3, 9); b = rint(3, 9); op = '×'; ans = a * b; }
    else if (k < 0.7){ b = rint(2, 9); ans = rint(2, 9); a = b * ans; op = ':'; }
    else if (k < 0.85){ a = rint(26, 99); b = rint(16, 99); op = '+'; ans = a + b; }
    else { a = rint(50, 150); b = rint(16, a - 12); op = '−'; ans = a - b; }
  }
  const pool = shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10,
    op === '×' ? ans + a : ans + 3, op === '×' ? ans - b : ans - 3]);
  const choices = [ans];
  for (const c of pool){ if (choices.length >= 4) break; if (c >= 0 && !choices.includes(c)) choices.push(c); }
  for (let n = 4; choices.length < 4; n++) if (!choices.includes(ans + n)) choices.push(ans + n);
  return { text: a + ' ' + op + ' ' + b, ans, choices: shuffle(choices) };
}
function startMath({ stage, run, level, hud, finish }){
  const DUR = 60000, target = [18, 15, 12][level];
  let right = 0, wrong = 0, lock = false, ended = false, q = null, lastText = '';
  const bar = h('i');
  const qEl = h('p', { class: 'q-text', 'aria-live': 'polite' });
  const box = h('div', { class: 'q-choices' });
  stage.append(h('div', { class: 'q-timer' }, bar), qEl, box);
  const t0 = performance.now();
  function next(){
    do { q = makeQuestion(level); } while (q.text === lastText);
    lastText = q.text; lock = false;
    qEl.textContent = q.text + ' = ?';
    box.replaceChildren(...q.choices.map((c, i) =>
      h('button', { class: 'q-choice', type: 'button', onclick: () => pick(i) }, h('kbd', { 'aria-hidden': 'true' }, i + 1), c)));
  }
  function pick(i){
    if (lock || ended || !q || !box.children[i]) return;
    lock = true;
    if (q.choices[i] === q.ans){
      right++; box.children[i].classList.add('is-right'); sfx.ok(); run.timeout(next, 280);
    } else {
      wrong++; box.children[i].classList.add('is-wrong');
      box.children[q.choices.indexOf(q.ans)].classList.add('is-right');
      sfx.bad(); run.timeout(next, 1100);
    }
    paint();
  }
  function paint(){
    const left = Math.max(0, DUR - (performance.now() - t0));
    bar.style.width = (left / DUR * 100) + '%';
    hud([['Đúng', right + ' câu'], ['Còn', Math.ceil(left / 1000) + ' giây']]);
    if (left <= 0 && !ended){
      ended = true;
      finish({
        mark: clamp(Math.round(right / target * 10), 1, 10), record: right,
        lines: ['Em trả lời đúng ' + right + ' câu trong 60 giây' + (wrong ? ', sai ' + wrong + ' câu.' : right ? ', không sai câu nào!' : '.')]
      });
    }
  }
  run.on(window, 'keydown', (e) => { if (e.key.length === 1 && e.key >= '1' && e.key <= '4') pick(+e.key - 1); });
  run.interval(paint, 100);
  next(); paint();
}

/* ================= 3. Bắt ếch ao sen ================= */
function startFrog({ stage, run, level, hud, finish }){
  const cfg = [
    { stay: [1500, 1050], gap: [1000, 760], target: 36 },
    { stay: [1150, 780], gap: [850, 600], target: 40 },
    { stay: [900, 560], gap: [700, 450], target: 46 }
  ][level];
  const DUR = 40000;
  let score = 0, hearts = 3, ended = false;
  const t0 = performance.now();
  const prog = () => Math.min(1, (performance.now() - t0) / DUR);
  const pond = h('div', { class: 'pond' });
  const pads = [];
  for (let i = 0; i < 9; i++){
    const critter = h('span', { class: 'critter', 'aria-hidden': 'true' });
    const btn = h('button', { class: 'pad', type: 'button', 'aria-label': 'Lá sen trống' }, critter);
    const p = { btn, critter, kind: null, hideId: 0 };
    btn.addEventListener('pointerdown', (e) => { e.preventDefault(); hit(p); });
    btn.addEventListener('click', (e) => { if (e.detail === 0) hit(p); });   // keyboard
    pads.push(p); pond.append(btn);
  }
  function spawn(){
    if (ended) return;
    const free = pads.filter((p) => !p.kind);
    if (free.length > 6){                      // never more than three up at once
      const p = free[rand(free.length)], k = Math.random();
      p.kind = k < 0.16 ? 'duck' : k < 0.27 ? 'gold' : 'frog';
      p.critter.textContent = p.kind === 'duck' ? '🦆' : '🐸';
      p.btn.dataset.kind = p.kind; p.btn.classList.add('is-up');
      p.btn.setAttribute('aria-label', p.kind === 'duck' ? 'Vịt' : p.kind === 'gold' ? 'Ếch vàng' : 'Ếch');
      p.hideId = run.timeout(() => hide(p), lerp(cfg.stay[0], cfg.stay[1], prog()));
    }
    run.timeout(spawn, lerp(cfg.gap[0], cfg.gap[1], prog()) * (0.8 + Math.random() * 0.4));
  }
  function hide(p){
    p.kind = null; p.btn.classList.remove('is-up'); delete p.btn.dataset.kind;
    p.btn.setAttribute('aria-label', 'Lá sen trống');
  }
  function pop(p, text, bad){
    const s = h('span', { class: 'pop' + (bad ? ' is-bad' : ''), 'aria-hidden': 'true' }, text);
    p.btn.append(s); run.timeout(() => s.remove(), 650);
  }
  function hit(p){
    if (ended || !p.kind) return;
    clearTimeout(p.hideId);
    if (p.kind === 'duck'){ hearts--; sfx.bad(); pop(p, 'Quạc!', true); }
    else { const pts = p.kind === 'gold' ? 3 : 1; score += pts; (pts > 1 ? sfx.star : sfx.ok)(); pop(p, '+' + pts); }
    hide(p); paint();
  }
  function paint(){
    const left = Math.max(0, DUR - (performance.now() - t0)), hp = Math.max(0, hearts);
    hud([['Điểm', score], ['Tim', '♥'.repeat(hp) + '♡'.repeat(3 - hp)], ['Còn', Math.ceil(left / 1000) + ' giây']]);
    if ((left <= 0 || hearts <= 0) && !ended){
      ended = true;
      const early = hearts <= 0;
      run.timeout(() => finish({
        mark: clamp(Math.round(score / cfg.target * 10), 1, 10), record: score,
        lines: [early ? 'Em chạm phải vịt 3 lần nên trò chơi dừng sớm. Em được ' + score + ' điểm.'
                      : 'Em bắt ếch được ' + score + ' điểm trong 40 giây.']
      }), early ? 500 : 0);
    }
  }
  stage.append(pond);
  run.interval(paint, 100); run.timeout(spawn, 600); paint();
}

function startWords({ stage, run, level, hud, finish }){
  const words = shuffle(WORDS[level]).slice(0, 6);
  let wi = 0, total = 0, solved = 0;
  let sylls, target, tiles, slots, locked, tries, hints, busy;
  const emojiEl = h('div', { class: 'w-emoji', 'aria-hidden': 'true' });
  const clueEl = h('p', { class: 'w-clue' });
  const slotsEl = h('div', { class: 'w-slots' });
  const msgEl = h('p', { class: 'w-msg', 'aria-live': 'polite' });
  const poolEl = h('div', { class: 'w-pool' });
  const hintBtn = h('button', { class: 'btn', type: 'button', onclick: hint }, 'Gợi ý một chữ');
  const skipBtn = h('button', { class: 'btn', type: 'button', onclick: skip }, 'Bỏ qua từ này');
  stage.append(emojiEl, clueEl, slotsEl, msgEl, poolEl, h('div', { class: 'w-actions' }, hintBtn, skipBtn));

  function load(){
    const w = words[wi];
    sylls = w.w.normalize('NFC').split(' ').map((s) => Array.from(s));
    target = sylls.flat();
    let order, guard = 0;
    do { order = shuffle(target.map((_, i) => i)); }
    while (order.every((src, i) => target[src] === target[i]) && ++guard < 30);
    tiles = order.map((src, id) => ({ id, ch: target[src] }));
    slots = target.map(() => null); locked = target.map(() => false);
    tries = 0; hints = 0; busy = false;
    emojiEl.textContent = w.e; clueEl.textContent = w.c; msgEl.textContent = '';
    draw(); paint();
  }
  function paint(){ hud([['Từ', (wi + 1) + '/' + words.length], ['Điểm', total]]); }
  function draw(){
    let n = 0;
    slotsEl.replaceChildren(...sylls.map((s) => h('div', { class: 'w-syll' }, s.map(() => {
      const k = n++, id = slots[k];
      const b = h('button', {
        class: 'w-slot' + (id != null ? ' is-filled' : '') + (locked[k] ? ' is-locked' : ''), type: 'button',
        'aria-label': id != null ? 'Ô ' + (k + 1) + ': chữ ' + tiles[id].ch : 'Ô ' + (k + 1) + ' còn trống'
      }, id != null ? tiles[id].ch : '');
      b.disabled = busy || id == null || locked[k];
      b.addEventListener('click', () => unplace(k));
      return b;
    }))));
    poolEl.replaceChildren(...tiles.map((t) => {
      const used = slots.includes(t.id);
      const b = h('button', { class: 'w-tile' + (used ? ' is-used' : ''), type: 'button' }, t.ch);
      b.disabled = busy || used;
      b.addEventListener('click', () => place(t.id));
      return b;
    }));
    hintBtn.disabled = skipBtn.disabled = busy;
  }
  function place(id){
    if (busy) return;
    const k = slots.indexOf(null); if (k < 0) return;
    slots[k] = id; sfx.tap();
    if (slots.includes(null)) draw(); else check();
  }
  function unplace(k){ if (busy || locked[k]) return; slots[k] = null; draw(); }
  function check(){
    busy = true;
    if (slots.every((id, k) => tiles[id].ch === target[k])){
      const pts = Math.max(1, 3 - tries - hints);
      total += pts; solved++; locked = locked.map(() => true);
      msgEl.textContent = 'Đúng rồi! +' + pts + ' điểm'; sfx.ok();
      draw(); paint(); run.timeout(advance, 1100);
    } else {
      tries++; msgEl.textContent = 'Chưa đúng. Chữ nào đúng chỗ thì được giữ lại.'; sfx.bad();
      slotsEl.classList.add('is-shake'); draw();
      run.timeout(() => {
        slotsEl.classList.remove('is-shake');
        slots.forEach((id, k) => { if (tiles[id].ch === target[k]) locked[k] = true; else slots[k] = null; });
        busy = false; draw();
      }, 800);
    }
  }
  function hint(){
    if (busy) return;
    const k = slots.findIndex((id, i) => !locked[i] && (id == null || tiles[id].ch !== target[i]));
    if (k < 0) return;
    hints++; slots[k] = null;
    const want = target[k];
    let t = tiles.find((x) => x.ch === want && !slots.includes(x.id));
    if (!t){                                   // the letter sits in another open slot: move it here
      let j = slots.findIndex((id, i) => id != null && !locked[i] && tiles[id].ch === want && target[i] !== want);
      if (j < 0) j = slots.findIndex((id, i) => id != null && !locked[i] && tiles[id].ch === want);
      t = tiles[slots[j]]; slots[j] = null;
    }
    slots[k] = t.id; locked[k] = true; sfx.tap();
    msgEl.textContent = 'Gợi ý: ô số ' + (k + 1) + ' là chữ ' + want + '.';
    if (slots.includes(null)) draw(); else check();
  }
  function skip(){
    if (busy) return;
    busy = true;
    const left = tiles.slice();
    slots = target.map((ch) => left.splice(left.findIndex((t) => t.ch === ch), 1)[0].id);
    locked = locked.map(() => true);
    msgEl.textContent = 'Đáp án là ' + words[wi].w + '.';
    draw(); run.timeout(advance, 1800);
  }
  function advance(){
    wi++;
    if (wi < words.length){ load(); return; }
    const max = words.length * 3;
    finish({
      mark: clamp(Math.round(total / max * 10), 1, 10), record: total,
      lines: ['Em xếp đúng ' + solved + '/' + words.length + ' từ, được ' + total + '/' + max + ' điểm.']
    });
  }
  load();
}

/* ================= 5. Hứng quả chín ================= */
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const DISPLAY_FONT = 'Grandstander,"Baloo 2","Trebuchet MS",sans-serif';
const FRUITS = ['🍎','🍊','🍌','🍇','🍓','🍑','🍐','🥭'];
function startCatch({ stage, run, level, hud, finish }){
  const cfg = [
    { v: [0.26, 0.40], gap: [1.0, 0.72], target: 36 },
    { v: [0.34, 0.56], gap: [0.85, 0.52], target: 44 },
    { v: [0.44, 0.72], gap: [0.7, 0.40], target: 50 }
  ][level];
  const DUR = 45;
  const cv = h('canvas', { class: 'catch-cv', tabindex: '0', role: 'img',
    'aria-label': 'Sân hứng quả. Kéo chuột, kéo ngón tay hoặc bấm phím mũi tên trái, phải để đưa giỏ.' });
  const wrap = h('div', { class: 'catch-wrap' }, cv);
  stage.append(wrap);
  const ctx = cv.getContext('2d');
  let W = 300, H = 400, t = 0, score = 0, hearts = 3, ended = false;
  let spawnIn = 0.6, bx = 150, items = [], pops = [], colors = {}, colorAge = 999;
  const keys = { left: false, right: false };

  function size(){
    W = wrap.clientWidth || 300; H = wrap.clientHeight || 400;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function readColors(){
    const cs = getComputedStyle(document.documentElement);
    const v = (name, d) => cs.getPropertyValue(name).trim() || d;
    colors = { ink: v('--ink', '#2B2170'), bad: v('--bad', '#C4283C'), leaf: v('--leaf', '#43A862') };
  }
  const unit = () => clamp(W * 0.11, 34, 52);
  function spawn(){
    const k = Math.random(), s = unit(), p = Math.min(1, t / DUR);
    const kind = k < 0.16 ? 'chili' : k < 0.22 ? 'star' : 'fruit';
    items.push({
      kind, ch: kind === 'chili' ? '🌶️' : kind === 'star' ? '⭐' : FRUITS[rand(FRUITS.length)],
      x: s * 0.6 + Math.random() * (W - s * 1.2), y: -s,
      vy: H * lerp(cfg.v[0], cfg.v[1], p) * (0.9 + Math.random() * 0.25),
      rot: (Math.random() - 0.5) * 0.6, gone: false
    });
  }
  function step(dt){
    if (ended) return;
    if (Math.abs(wrap.clientWidth - W) > 1 || Math.abs(wrap.clientHeight - H) > 1) size();
    t += dt;
    const p = Math.min(1, t / DUR), s = unit(), bw = s * 1.7, by = H - s * 0.95;
    spawnIn -= dt;
    if (spawnIn <= 0){ spawn(); spawnIn = lerp(cfg.gap[0], cfg.gap[1], p) * (0.75 + Math.random() * 0.5); }
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    bx = clamp(bx + dir * W * 1.1 * dt, bw / 2, W - bw / 2);
    for (const it of items){
      it.y += it.vy * dt;
      if (it.y > by - s * 0.45 && it.y < by + s * 0.35 && Math.abs(it.x - bx) < bw * 0.5){
        it.gone = true;
        if (it.kind === 'chili'){ hearts--; sfx.bad(); pops.push({ x: it.x, y: by - s, text: 'Cay quá!', bad: true, life: 0.9 }); }
        else { const pts = it.kind === 'star' ? 5 : 1; score += pts; (pts > 1 ? sfx.star : sfx.ok)(); pops.push({ x: it.x, y: by - s, text: '+' + pts, bad: false, life: 0.7 }); }
      } else if (it.y > H + s) it.gone = true;
    }
    items = items.filter((it) => !it.gone);
    for (const q of pops){ q.life -= dt; q.y -= 40 * dt; }
    pops = pops.filter((q) => q.life > 0);
    draw(s, by);
    const hp = Math.max(0, hearts);
    hud([['Điểm', score], ['Tim', '♥'.repeat(hp) + '♡'.repeat(3 - hp)], ['Còn', Math.max(0, Math.ceil(DUR - t)) + ' giây']]);
    if (hearts <= 0 || t >= DUR){
      ended = true;
      const early = hearts <= 0;
      run.timeout(() => finish({
        mark: clamp(Math.round(score / cfg.target * 10), 1, 10), record: score,
        lines: [early ? 'Em hứng trúng ớt cay 3 lần nên trò chơi dừng sớm. Em được ' + score + ' điểm.'
                      : 'Em hứng được ' + score + ' điểm trong 45 giây.']
      }), early ? 500 : 150);
    }
  }
  function draw(s, by){
    if (++colorAge > 45){ readColors(); colorAge = 0; }
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = colors.leaf; ctx.fillRect(0, H - s * 0.42, W, s * 0.42);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = colors.ink;
    ctx.font = s + 'px ' + EMOJI_FONT;
    for (const it of items){ ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot); ctx.fillText(it.ch, 0, 0); ctx.restore(); }
    ctx.font = (s * 1.5) + 'px ' + EMOJI_FONT;
    ctx.fillText('🧺', bx, by);
    ctx.font = '800 ' + Math.round(s * 0.5) + 'px ' + DISPLAY_FONT;
    for (const q of pops){
      ctx.globalAlpha = clamp(q.life * 2.5, 0, 1); ctx.fillStyle = q.bad ? colors.bad : colors.ink;
      ctx.fillText(q.text, clamp(q.x, 44, W - 44), q.y);
    }
    ctx.globalAlpha = 1;
  }
  const setX = (e) => { bx = e.clientX - cv.getBoundingClientRect().left; };
  run.on(cv, 'pointerdown', (e) => {
    setX(e); e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    try { cv.focus({ preventScroll: true }); } catch (err) {}
  });
  run.on(cv, 'pointermove', setX);
  const key = (down) => (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ keys.left = down; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ keys.right = down; e.preventDefault(); }
  };
  run.on(window, 'keydown', key(true));
  run.on(window, 'keyup', key(false));
  run.on(window, 'blur', () => { keys.left = keys.right = false; });
  size(); bx = W / 2; readColors();
  draw(unit(), H - unit() * 0.95);
  run.frame(step);
}

const LEVEL_NAMES = ['Dễ', 'Vừa', 'Khó'];
const LEVEL_AGES = ['7–8 tuổi', '9–10 tuổi', '11 tuổi'];
const phe = (m) => m >= 10 ? 'Xuất sắc! Em giỏi quá!' : m >= 9 ? 'Rất giỏi! Phát huy nhé!' : m >= 8 ? 'Giỏi lắm!'
  : m >= 7 ? 'Khá lắm! Cố thêm chút nữa nhé.' : m >= 5 ? 'Có cố gắng. Luyện thêm sẽ tiến bộ!' : 'Chưa quen tay thôi. Chơi lại là giỏi ngay!';

/* ================= shell ================= */
const home = $('#home'), play = $('#play'), menu = $('#menu');
const stage = $('#stage'), hudEl = $('#hud'), titleEl = $('#gameTitle'), skillEl = $('#gameSkill');
const backBtn = $('#backBtn'), soundBtn = $('#soundBtn');
let shown = null, run = null, hudSig = '';

function setHud(items){
  const sig = JSON.stringify(items);
  if (sig === hudSig) return;
  hudSig = sig;
  hudEl.replaceChildren(...items.map(([label, value]) => h('span', null, label, ' ', h('b', null, value))));
}
function stopRun(){ if (run){ run.stop(); run = null; } hudSig = ''; hudEl.replaceChildren(); }

function drawMenu(){
  const marks = store.get('mark', {});
  menu.replaceChildren(...GAMES.map((g, i) => {
    const m = marks[g.id];
    return h('li', null, h('button', { class: 'game-row', type: 'button', onclick: () => go(g.id) },
      h('span', { class: 'g-icon', html: g.icon }),
      h('span', { class: 'g-text' },
        h('span', { class: 'g-no' }, 'Trò ' + (i + 1) + ' · ' + g.skill),
        h('span', { class: 'g-name' }, h('span', null, g.name)),
        h('span', { class: 'g-desc' }, g.desc)),
      h('span', { class: 'g-best' },
        m != null ? h('span', { class: 'mark' }, m) : h('span', { class: 'mark is-empty' }, '?'),
        h('span', { class: 'g-cap' }, m != null ? 'điểm cao nhất' : 'chưa chơi'))));
  }));
}

function showIntro(game){
  stopRun();
  const recs = store.get('rec', {});
  stage.replaceChildren(h('div', { class: 'intro' },
    h('h3', null, 'Cách chơi'),
    h('ul', { class: 'howto' }, game.how.map((line) => h('li', null, line))),
    h('h3', null, 'Chọn mức chơi'),
    h('div', { class: 'levels' }, game.levels.map((what, i) => {
      const r = recs[game.id + ':' + i];
      return h('button', { class: 'level', type: 'button', onclick: () => startGame(game, i) },
        h('span', { class: 'lv-age' }, LEVEL_AGES[i]),
        h('span', { class: 'lv-name' }, LEVEL_NAMES[i]),
        h('span', { class: 'lv-what' }, what),
        h('span', { class: 'lv-rec' }, r != null ? 'Kỷ lục: ' + r + ' ' + game.unit : 'Chưa có kỷ lục'));
    }))));
}

function startGame(game, level){
  stopRun();
  const mine = run = makeRun();
  stage.replaceChildren();
  game.start({ stage, run: mine, level, hud: setHud,
    finish: (res) => { if (run === mine) showResult(game, level, res); } });
}

function showResult(game, level, res){
  if (run){ run.stop(); run = null; }
  const key = game.id + ':' + level, recs = store.get('rec', {}), old = recs[key];
  const better = old == null || (game.lowerBetter ? res.record < old : res.record > old);
  if (better){ recs[key] = res.record; store.set('rec', recs); }
  const marks = store.get('mark', {});
  if (!(marks[game.id] >= res.mark)){ marks[game.id] = res.mark; store.set('mark', marks); }

  const again = h('button', { class: 'btn btn-primary', type: 'button', onclick: () => startGame(game, level) }, 'Chơi lại');
  const change = h('button', { class: 'btn', type: 'button', onclick: () => showIntro(game) }, 'Đổi mức chơi');
  const leave = h('button', { class: 'btn', type: 'button', onclick: () => go('') }, 'Về sân chơi');
  const buttons = [again, change, leave];
  /* A child tapping fast when time runs out should not hit these by accident. */
  buttons.forEach((b) => { b.disabled = true; });
  setTimeout(() => { buttons.forEach((b) => { b.disabled = false; }); if (again.isConnected) again.focus({ preventScroll: true }); }, 700);

  stage.replaceChildren(h('div', { class: 'result' },
    h('div', { class: 'mark mark-big', role: 'img', 'aria-label': res.mark + ' điểm' }, res.mark),
    h('div', { class: 'result-text' },
      h('p', { class: 'phe' }, phe(res.mark)),
      res.lines.map((line) => h('p', { class: 'result-line' }, line)),
      h('p', { class: 'result-rec' },
        better && res.record > 0
          ? h('span', { class: 'new-rec' }, 'Kỷ lục mới của mức ' + LEVEL_NAMES[level] + '!')
          : 'Kỷ lục mức ' + LEVEL_NAMES[level] + ': ' + (old != null ? old + ' ' + game.unit : 'chưa có'))),
    h('div', { class: 'result-actions' }, buttons)));
  sfx.win();
}

/* ---------- which screen is showing; each game has its own #name ---------- */
function render(id){
  const game = GAMES.find((g) => g.id === id);
  id = game ? id : '';
  if (id === shown) return;
  shown = id;
  stopRun();
  if (game){
    home.hidden = true; play.hidden = false;
    titleEl.textContent = game.name;
    skillEl.textContent = 'Trò ' + (GAMES.indexOf(game) + 1) + ' · ' + game.skill;
    showIntro(game);
  } else {
    play.hidden = true; home.hidden = false;
    stage.replaceChildren(); drawMenu();
  }
  try { window.scrollTo(0, 0); } catch (e) {}
}
function go(id){
  try { if (location.hash.slice(1) !== id) location.hash = id; } catch (e) {}
  render(id);
}
window.addEventListener('hashchange', () => render(location.hash.slice(1)));
backBtn.addEventListener('click', () => go(''));

function paintSound(){
  soundBtn.textContent = 'Âm thanh: ' + (soundOn ? 'bật' : 'tắt');
  soundBtn.setAttribute('aria-pressed', String(soundOn));
}
soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); paintSound(); sfx.tap(); });

/* Pupils head every notebook page with the day and date. */
(() => {
  const d = new Date();
  const days = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
  $('#dateline').textContent = days[d.getDay()] + ', ngày ' + d.getDate() + ' tháng ' + (d.getMonth() + 1) + ' năm ' + d.getFullYear();
})();

let booted = false;
function boot(data){
  if (booted) return;
  booted = true;
  paintSound();
  render(data && typeof data.screen === 'string' ? data.screen : location.hash.slice(1));
}
try { window.claude?.hot?.snapshot?.(() => ({ screen: shown || '' })); } catch (e) {}
try {
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
} catch (e) { boot({}); }
setTimeout(() => boot({}), 1500);
})();
</script>
